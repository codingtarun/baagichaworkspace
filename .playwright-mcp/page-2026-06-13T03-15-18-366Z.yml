              - generic [ref=e80]:
                - paragraph [ref=e81]: Tarun is a software engineer with over five years of experience building practical, AI-powered applications across e-commerce, education, travel, and agriculture. He enjoys turning complex problems into simple, reliable tools that people actually want to use.
                - paragraph [ref=e82]: His connection to apple farming runs deep. Before moving into tech, he spent several years working closely with orchards in Himachal Pradesh — from grading and procurement to understanding what farmers need at the ground level. That experience showed him how hard farmers work and how few digital tools are truly built for them. With Baagvaani, he wants to bring expert orchard knowledge into farmers' hands in a way that is simple, clear, and actionable.
