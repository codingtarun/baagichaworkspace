                  - text: ", a leading platform teaching regenerative apple farming across the Himalayas. With years of hands-on orchard experience in Himachal Pradesh, he blends mountaineering grit with ecological innovation to heal soil, nurture communities, and revive the spirit of natural farming."
                - paragraph [ref=e116]: He has trained hundreds of farmers through structured courses — from regenerative orchard management and 2D-3D canopy systems to precision pruning and chemical-free disease control. His research-backed articles on soil health, fungicide risks, and failing traditional systems have become essential reading for apple growers across India. Through workshops, online courses, and a growing farmer community, he is building a movement to restore the land while growing better apples.
