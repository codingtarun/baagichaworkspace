              - generic [ref=e169]:
                - paragraph [ref=e170]: Tarun is a full-time senior software engineer and a part-time farmer. While learning farming hands-on, he faced countless challenges — from confusing spray schedules to unreliable disease advice — and tried to solve them for himself. But he soon realized that thousands of farmers across the Himalayas were struggling with the exact same problems, with no real help available on the internet.
                - paragraph [ref=e171]: That gap between technology and farming became his calling. As the tech brain behind Baagvaani, he is building an application that puts expert orchard knowledge directly into farmers' hands — simple, bilingual, and actionable. His mission is to make technology work for farmers, not the other way around.
              - generic [ref=e172]:
                - generic [ref=e173]: Building since 2024
