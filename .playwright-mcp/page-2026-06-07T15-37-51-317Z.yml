              - generic [ref=e198]:
                - paragraph [ref=e199]: Pranav is transforming Himalayan apple farming through regenerative practices that heal the soil, nurture people, and revive community spirit. As the farmer behind the application, he brings ground-level experience from his own orchard in Himachal Pradesh. Fuelled by personal challenges and a deep passion for sustainability, he blends mountaineering grit with ecological innovation to inspire a new wave of restorative agriculture across India.
                - paragraph [ref=e200]: "Through RegenApples.com, he teaches natural orchard methods that build healthy soil and support local life — offering courses, workshops under the trees, and a growing community of farmers ready to embrace chemical-free farming. His mission is simple: grow better apples while restoring the land for future generations."
