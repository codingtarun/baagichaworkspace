            - paragraph [ref=e54]: Packing Materials
            - paragraph [ref=e55]: Use CFB (corrugated fibreboard) boxes of 20kg. Line with foam net wraps for each apple — these reduce transit bruising by 80%. Avoid wooden boxes which add weight and can harbour fungal spores. Lorem ipsum dolor sit amet, consectetur adipiscing elit.
            - paragraph [ref=e56]: Pre-Cooling Before Packing
            - paragraph [ref=e57]: Field heat removal is critical. Pack in the cool of the morning or in a shaded packing shed. Pre-cooling fruit to 4°C before loading extends shelf life by 4–6 days and reduces transit losses. Lorem ipsum dolor sit amet, consectetur adipiscing elit.
