                  - text: with 5+ years of experience building AI-integrated systems and high-performance Laravel applications. Currently leading AI-driven full-stack development at PrimeGurukul, where he has achieved a 4x productivity boost by integrating AI into daily engineering workflows. He has delivered 10+ projects across e-commerce, travel, ed-tech, and agri-tech — including the complete backend and REST API for the Mawadiy e-commerce platform.
                - paragraph [ref=e172]: "His journey into farming tech is deeply personal. Before code, he spent six years as a Floor Manager & Grading Technician at HimaFresh Produce Co., managing apple procurement, quality assurance, and market deployment. When he transitioned into software development, he saw the same gaps he once faced on the orchard floor — no reliable spray schedules, no accessible disease advice, no digital tools built for farmers. Baagvaani is his answer: a full-stack Laravel + React Native platform that brings expert orchard knowledge directly into farmers' hands — simple, bilingual, and actionable."
