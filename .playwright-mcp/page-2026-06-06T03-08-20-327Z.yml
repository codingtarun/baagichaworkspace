        - generic [ref=e93]:
          - article [ref=e94]:
            - generic [ref=e95]:
              - generic [ref=e96]:
                - img "Pranav Rawat" [ref=e98]
                - generic [ref=e99]:
                  - heading "Pranav Rawat" [level=3] [ref=e100]
                  - paragraph [ref=e101]: Co-Founder & Farmer Behind the Application
              - generic [ref=e102]:
                - paragraph [ref=e103]: "Pranav is transforming Himalayan apple farming through regenerative practices that heal the soil, nurture people, and revive community spirit. As the farmer behind the application, he brings ground-level experience from his own orchard in Himachal Pradesh. Fuelled by personal challenges and a deep passion for sustainability, he blends mountaineering grit with ecological innovation to inspire a new wave of restorative agriculture across India. Through RegenApples.com, he teaches natural orchard methods that build healthy soil and support local life — offering courses, workshops under the trees, and a growing community of farmers ready to embrace chemical-free farming. His mission is simple: grow better apples while restoring the land for future generations."
                - button
          - article [ref=e104]:
            - generic [ref=e105]:
              - generic [ref=e106]:
                - img "Tarun Chauhan" [ref=e108]
                - generic [ref=e109]:
                  - heading "Tarun Chauhan" [level=3] [ref=e110]
                  - paragraph [ref=e111]: Co-Founder & Tech Brain Behind the App
              - generic [ref=e112]:
                - paragraph [ref=e113]: Tarun is a full-time senior software engineer and a part-time farmer. While learning farming hands-on, he faced countless challenges — from confusing spray schedules to unreliable disease advice — and tried to solve them for himself. But he soon realized that thousands of farmers across the Himalayas were struggling with the exact same problems, with no real help available on the internet. That gap between technology and farming became his calling. As the tech brain behind Baagvaani, he is building an application that puts expert orchard knowledge directly into farmers' hands — simple, bilingual, and actionable. His mission is to make technology work for farmers, not the other way around.
                - button
