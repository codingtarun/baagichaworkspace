        - generic [ref=e43]:
          - heading "Recognition" [level=3] [ref=e44]
          - paragraph [ref=e45]: White powdery coating on young shoot tips and leaves in spring. Infected blossoms fail to set fruit. Disease thrives at 15–25°C with low humidity — opposite conditions to Apple Scab.
          - heading "High-Risk Periods" [level=3] [ref=e46]
          - paragraph [ref=e47]: Watch for powdery mildew from Green Tip through Petal Fall. High-altitude orchards (above 7,000 ft) are especially prone when spring is warm and dry.
          - heading "Management" [level=3] [ref=e48]
          - paragraph [ref=e49]: Apply Hexaconazole 5 SC or Triadimefon at 0.05% from Silver Tip onwards. Sulfur dust (300 mesh) at 3 kg/acre works well for organic orchards. Prune and destroy infected shoot tips before flowering.
